<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Studio Backlight -->
    <radialGradient id="rimGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Skin Tone Gradients -->
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b99c" />
      <stop offset="40%" stop-color="#dba384" />
      <stop offset="85%" stop-color="#c58b6c" />
      <stop offset="100%" stop-color="#b07556" />
    </linearGradient>

    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#8a5336" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="neckShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a5a3a" />
      <stop offset="100%" stop-color="#733e24" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2729" />
      <stop offset="30%" stop-color="#191718" />
      <stop offset="100%" stop-color="#0d0c0d" />
    </linearGradient>

    <!-- Navy Executive Shirt Gradient -->
    <linearGradient id="shirtNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223659" />
      <stop offset="50%" stop-color="#16243d" />
      <stop offset="100%" stop-color="#0c1626" />
    </linearGradient>
    
    <linearGradient id="collarInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b436e" />
      <stop offset="100%" stop-color="#142036" />
    </linearGradient>

    <!-- Stubble Pattern / Filter -->
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Background Studio Surface -->
  <rect width="400" height="400" fill="url(#bgGlow)" />
  <circle cx="200" cy="180" r="160" fill="url(#rimGlow)" />

  <!-- Shoulders & Navy Blue Shirt -->
  <g id="clothing">
    <!-- Body / Shoulders -->
    <path d="M 40 400 C 50 330 95 300 145 285 L 200 315 L 255 285 C 305 300 350 330 360 400 Z" fill="url(#shirtNavy)" />
    
    <!-- Chest / Inner Placket -->
    <path d="M 175 295 L 200 375 L 225 295 Z" fill="#121c2e" />
    <line x1="200" y1="315" x2="200" y2="400" stroke="#0a101b" stroke-width="2" stroke-dasharray="3 3" />
    
    <!-- Buttons -->
    <circle cx="200" cy="340" r="3.5" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="200" cy="375" r="3.5" fill="#334155" stroke="#1e293b" stroke-width="1.5" />

    <!-- Left Shirt Collar -->
    <path d="M 145 285 L 188 320 L 165 270 L 140 280 Z" fill="url(#collarInner)" stroke="#0f172a" stroke-width="1.5" />
    <!-- Right Shirt Collar -->
    <path d="M 255 285 L 212 320 L 235 270 L 260 280 Z" fill="url(#collarInner)" stroke="#0f172a" stroke-width="1.5" />
    <!-- Collar Fold Lines -->
    <path d="M 140 280 Q 170 295 188 320" fill="none" stroke="#38517c" stroke-width="1.5" />
    <path d="M 260 280 Q 230 295 212 320" fill="none" stroke="#38517c" stroke-width="1.5" />
  </g>

  <!-- Neck -->
  <g id="neck">
    <path d="M 160 220 L 160 285 Q 200 305 240 285 L 240 220 Z" fill="url(#skinBase)" />
    <path d="M 160 220 L 160 255 Q 200 275 240 255 L 240 220 Z" fill="url(#neckShadow)" opacity="0.6" />
    <!-- Adam's Apple / Neck Contour -->
    <path d="M 195 250 Q 200 255 205 250" fill="none" stroke="#a06040" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Head & Ears -->
  <g id="head">
    <!-- Left Ear -->
    <path d="M 125 180 C 115 180 115 215 128 220 C 130 215 130 190 128 180 Z" fill="#cf9776" />
    <path d="M 125 188 C 120 190 120 205 126 210" fill="none" stroke="#aa6b4c" stroke-width="2" />

    <!-- Right Ear -->
    <path d="M 275 180 C 285 180 285 215 272 220 C 270 215 270 190 272 180 Z" fill="#cf9776" />
    <path d="M 275 188 C 280 190 280 205 274 210" fill="none" stroke="#aa6b4c" stroke-width="2" />

    <!-- Main Face Shape (Guy's strong masculine oval / jaw structure) -->
    <path d="M 128 165 C 125 110 160 95 200 95 C 240 95 275 110 272 165 C 272 205 260 248 200 252 C 140 248 128 205 128 165 Z" fill="url(#skinBase)" />
    <path d="M 128 165 C 125 110 160 95 200 95 C 240 95 275 110 272 165 C 272 205 260 248 200 252 C 140 248 128 205 128 165 Z" fill="url(#skinShadow)" />

    <!-- Temples & Forehead Shading -->
    <path d="M 132 140 C 140 105 170 102 200 102 C 230 102 260 105 268 140 C 240 125 160 125 132 140 Z" fill="#b07556" opacity="0.25" />
  </g>

  <!-- Facial Stubble / Beard (Guy's Signature Trimmed Shadow) -->
  <g id="stubble" opacity="0.45">
    <path d="M 132 180 C 132 225 155 248 200 250 C 245 248 268 225 268 180 C 265 210 245 238 200 240 C 155 238 135 210 132 180 Z" fill="#2d221e" filter="url(#softBlur)" />
    <!-- Mustache Area -->
    <path d="M 175 215 Q 200 208 225 215 Q 200 224 175 215 Z" fill="#2d221e" filter="url(#softBlur)" />
    <!-- Chin Shadow -->
    <circle cx="200" cy="242" r="14" fill="#2d221e" filter="url(#softBlur)" />
  </g>

  <!-- Eyes & Eyebrows -->
  <g id="eyes_brows">
    <!-- Left Eyebrow (Strong, masculine arch) -->
    <path d="M 145 155 C 158 148 178 148 188 153 C 178 152 158 153 145 158 Z" fill="#141113" />
    <!-- Right Eyebrow -->
    <path d="M 255 155 C 242 148 222 148 212 153 C 222 152 242 153 255 158 Z" fill="#141113" />

    <!-- Eye Sockets Shading -->
    <ellipse cx="168" cy="168" rx="16" ry="7" fill="#a46445" opacity="0.3" />
    <ellipse cx="232" cy="168" rx="16" ry="7" fill="#a46445" opacity="0.3" />

    <!-- Left Eye White & Lids -->
    <path d="M 152 168 Q 168 160 184 168 Q 168 176 152 168 Z" fill="#f8fafc" stroke="#5a3422" stroke-width="1.2" />
    <!-- Left Iris (Warm Dark Brown) -->
    <circle cx="168" cy="168" r="5.2" fill="#3b2314" />
    <circle cx="168" cy="168" r="3.2" fill="#100b07" />
    <circle cx="166.5" cy="166" r="1.3" fill="#ffffff" />
    <!-- Left Eyelid Fold -->
    <path d="M 154 162 Q 168 158 182 162" fill="none" stroke="#7e462d" stroke-width="1.2" />

    <!-- Right Eye White & Lids -->
    <path d="M 216 168 Q 232 160 248 168 Q 232 176 216 168 Z" fill="#f8fafc" stroke="#5a3422" stroke-width="1.2" />
    <!-- Right Iris (Warm Dark Brown) -->
    <circle cx="232" cy="168" r="5.2" fill="#3b2314" />
    <circle cx="232" cy="168" r="3.2" fill="#100b07" />
    <circle cx="230.5" cy="166" r="1.3" fill="#ffffff" />
    <!-- Right Eyelid Fold -->
    <path d="M 218 162 Q 232 158 246 162" fill="none" stroke="#7e462d" stroke-width="1.2" />
  </g>

  <!-- Nose -->
  <g id="nose">
    <path d="M 196 158 L 193 194 Q 186 198 185 201 Q 200 205 215 201 Q 214 198 207 194 L 204 158" fill="none" stroke="#aa6747" stroke-width="1.8" stroke-linecap="round" />
    <!-- Nostrils -->
    <ellipse cx="192" cy="200" rx="3.5" ry="2" fill="#542b18" />
    <ellipse cx="208" cy="200" rx="3.5" ry="2" fill="#542b18" />
    <path d="M 194 199 Q 200 202 206 199" fill="none" stroke="#874729" stroke-width="2" />
  </g>

  <!-- Mouth & Smile -->
  <g id="mouth">
    <!-- Philtrum -->
    <path d="M 197 203 L 197 212 M 203 203 L 203 212" stroke="#b07152" stroke-width="1.2" opacity="0.6" />
    <!-- Upper Lip -->
    <path d="M 182 220 Q 192 216 200 218 Q 208 216 218 220 Q 200 223 182 220 Z" fill="#9e5647" />
    <!-- Smile Line -->
    <path d="M 180 220 Q 200 226 220 220" fill="none" stroke="#481f18" stroke-width="2" stroke-linecap="round" />
    <!-- Lower Lip -->
    <path d="M 185 221 Q 200 231 215 221 Q 200 226 185 221 Z" fill="#ba6f5e" />
    <!-- Chin crease -->
    <path d="M 192 236 Q 200 238 208 236" fill="none" stroke="#a05e40" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Hair (Short, styled cropped executive hair textured on top) -->
  <g id="hair">
    <!-- Main Hair Mass -->
    <path d="M 125 155 C 122 105 145 70 200 68 C 255 70 278 105 275 155 C 270 135 264 115 250 102 C 235 90 215 88 200 88 C 185 88 165 90 150 102 C 136 115 130 135 125 155 Z" fill="url(#hairGrad)" />
    
    <!-- Top Hair Spikes / Texture -->
    <path d="M 155 92 Q 170 72 185 80 Q 200 65 215 78 Q 230 70 245 92 Q 225 82 200 84 Q 175 82 155 92 Z" fill="#242123" />
    
    <!-- Sideburns -->
    <path d="M 128 150 L 126 180 L 132 178 L 132 145 Z" fill="#1b181a" />
    <path d="M 272 150 L 274 180 L 268 178 L 268 145 Z" fill="#1b181a" />
  </g>

  <!-- High-Tech Ambient Rim Light Ring (TECH-SELECT signature branding) -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#rimGlow)" stroke-width="4" opacity="0.7" />
</svg>
